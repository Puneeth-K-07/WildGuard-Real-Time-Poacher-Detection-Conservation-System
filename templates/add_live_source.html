<!DOCTYPE html>
<html>
<head>
    <title>Add Live Camera Source</title>
    <style>
        body {
            background-color: #000;
            color: #0ff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
        }

        .card {
            width: 450px;
            margin: auto;
            padding: 35px;
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid #0ff;
            border-radius: 15px;
            box-shadow: 0 0 25px #0ff;
        }

        h2 {
            margin-bottom: 10px;
            text-shadow: 0 0 10px #0ff;
        }

        p {
            color: #9ff;
            font-size: 15px;
        }

        input[type=text] {
            width: 90%;
            padding: 12px;
            border: 1px solid #0ff;
            background: rgba(0,0,0,0.85);
            color: #0ff;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 16px;
            outline: none;
            box-shadow: 0 0 10px #0ff inset;
        }

        button {
            background-color: #000;
            border: 2px solid #0ff;
            border-radius: 8px;
            padding: 10px 35px;
            margin-top: 25px;
            color: #0ff;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }

        a {
            color: #0ff;
            margin-top: 20px;
            display: inline-block;
            font-size: 15px;
            text-decoration: none;
        }

        a:hover {
            text-shadow: 0 0 10px #0ff;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Add Live Camera Source</h2>

        <p>Enter RTSP / HTTP / HTTPS / YouTube Live URL</p>

        <form method="POST">
            <input type="text" name="source" placeholder="Enter live camera URL..." required>

            <button type="submit">➕ Add Source</button>
        </form>

        <a href="/">← Back to Home</a>
    </div>

</body>
</html>
