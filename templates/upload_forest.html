<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌲 Upload Aerial Image for Tree Counting</title>
  <style>
    body { background: radial-gradient(circle at top, #0b0b0b, #000); font-family: 'Poppins', sans-serif; color: #00ffcc; text-align: center; height: 100vh; padding-top:100px; }
    input[type="file"] { margin:20px; padding:10px; border:1px solid #00ffcc; border-radius:8px; background:#111; color:#00ffcc; }
    button { background:transparent; border:2px solid #00ffcc; color:#00ffcc; padding:10px 20px; border-radius:10px; cursor:pointer; }
    button:hover{ background:#00ffcc; color:#000; }
  </style>
</head>
<body>
  <div>
    <h1>🌲 Upload Drone or Satellite Image</h1>
    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*" required><br>
      <button type="submit">🚀 Analyze Tree Count</button>
    </form>
    <p style="margin-top:18px;"><a href="/">← Back to Home</a></p>
  </div>
</body>
</html>
