<!doctype html>
<html>
<head>
  <title>Detection Result</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }
    .message {
      font-size: 2rem;
      font-weight: bold;
      color: {{ color }};
    }
    a {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 24px;
      background-color: #00b894;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
    }
    a:hover {
      background-color: #019474;
    }
  </style>
</head>
<body>
  <h1 class="message">{{ message }}</h1>
  <a href="/">🏠 Back to Home</a>
</body>
</html>
