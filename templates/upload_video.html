<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎞️ Upload Video for Poacher Detection</title>
  <style>
    body {
      background: radial-gradient(circle at top, #0b0b0b, #000);
      font-family: "Poppins", sans-serif;
      color: #fff;
      text-align: center;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Animated glowing dots background */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle, #00ffcc22 1px, transparent 1px);
      background-size: 60px 60px;
      animation: moveDots 25s linear infinite;
      z-index: 0;
    }

    @keyframes moveDots {
      from { background-position: 0 0; }
      to { background-position: 300px 600px; }
    }

    .container {
      position: relative;
      z-index: 1;
      top: 50%;
      transform: translateY(-50%);
      width: 420px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #00ffcc44;
      box-shadow: 0 0 25px #00ffcc33;
      border-radius: 20px;
      padding: 40px 30px;
      backdrop-filter: blur(10px);
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #00ffcc;
      text-shadow: 0 0 15px #00ffcc;
      font-size: 1.8rem;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input[type="file"] {
      margin: 20px 0;
      background-color: #111;
      border: 1px solid #00ffcc55;
      border-radius: 10px;
      padding: 10px;
      color: #00ffcc;
      width: 100%;
      cursor: pointer;
    }

    input[type="file"]::-webkit-file-upload-button {
      background-color: #00ffcc;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      color: #000;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    input[type="file"]::-webkit-file-upload-button:hover {
      background-color: #00ffaa;
      box-shadow: 0 0 10px #00ffcc;
    }

    button {
      background-color: transparent;
      border: 2px solid #00ffcc;
      color: #00ffcc;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      width: 70%;
      margin-top: 10px;
    }

    button:hover {
      background-color: #00ffcc;
      color: #000;
      box-shadow: 0 0 15px #00ffcc;
      transform: scale(1.05);
    }

    a {
      display: inline-block;
      margin-top: 25px;
      color: #00ffcc;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    a:hover {
      color: #00ffaa;
      text-shadow: 0 0 10px #00ffcc;
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #00ffcc;
      text-shadow: 0 0 15px #00ffcc;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); text-shadow: 0 0 15px #00ffcc; }
      50% { transform: scale(1.2); text-shadow: 0 0 25px #00ffcc; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🎥</div>
    <h1>Upload Video for Poacher Detection</h1>
    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="file" accept="video/*" required>
      <button type="submit">🚀 Upload and Detect</button>
    </form>
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
