<!DOCTYPE html>
<html>
<head>
    <title>Result View</title>
    <style>
        body {
            background-color: #000;
            color: #0ff;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            text-shadow: 0 0 10px #0ff;
        }

        .card {
            margin: auto;
            padding: 20px;
            width: 600px;
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid #0ff;
            border-radius: 15px;
            box-shadow: 0 0 20px #0ff;
        }

        img {
            width: 90%;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 0 20px #0ff;
        }

        a {
            margin-top: 30px;
            display: inline-block;
            color: #0ff;
            font-size: 18px;
            text-decoration: none;
        }

        a:hover {
            text-shadow: 0 0 12px #0ff;
        }
    </style>
</head>

<body>

    <h1>Result</h1>

    <div class="card">
        <p style="font-size:18px;">{{ message }}</p>

        {% if proof %}
        <img src="/uploads/{{ proof }}" alt="Proof Image">
        {% endif %}
    </div>

    <a href="/">← Back to Home</a>

</body>
</html>
